# Сборка node-пакетов из фида nxhack/openwrt-node-packages под OpenWRT.
#
# Почему несколько джоб, а не одна:
#   весь фид (~150 пакетов) за один прогон упирается в лимит GitHub в 6 часов на job.
#   Поэтому дорогой рантайм Node.js (+npm/yarn) собирается отдельной джобой build-node,
#   а остальные пакеты делятся на N шардов (build-modules, matrix) и идут параллельно.
#   Индекс Packages и подпись генерируются один раз в deploy — после мерджа артефактов,
#   чтобы фид оставался единым и подпись не разъезжалась.
#
# Схема:
#   plan (10m) ─┬─ build-node   (node, node-npm, node-yarn)          ~1-1.5h
#               ├─ build-modules shard 1..N (остальные пакеты)       ~2-3h
#               └─ deploy: merge → Packages(+.sig) → gh-pages/packages
#
# Ветка gh-pages публикуется через force_orphan — история не растёт гигабайтами.

name: Build OpenWRT Node Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия OpenWRT (для SDK)"
        required: true
        default: "24.10.8"
      target:
        description: "Target (board/subtarget)"
        required: true
        default: "mediatek/filogic"
      arch:
        description: "Архитектура пакетов"
        required: true
        default: "aarch64_cortex-a53"
      shards:
        description: "Сколько джоб отдать под «остальные» пакеты"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "3"
      artifacts_run:
        description: "id прогона, из которого взять готовые ipk (пусто — собирать заново)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_FEED_URL: https://github.com/nxhack/openwrt-node-packages.git
  # Минимум пакетов в фиде: защита от публикации пустого/битого индекса
  MIN_PACKAGES: "100"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- plan
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.p.outputs.version }}
      target: ${{ steps.p.outputs.target }}
      arch: ${{ steps.p.outputs.arch }}
      sdk_url: ${{ steps.p.outputs.sdk_url }}
      sdk_file: ${{ steps.p.outputs.sdk_file }}
      sdk_sha: ${{ steps.p.outputs.sdk_sha }}
      cache_slug: ${{ steps.p.outputs.cache_slug }}
      shards: ${{ steps.p.outputs.shards }}
      shard_count: ${{ steps.p.outputs.shard_count }}
      feeds_branch: ${{ steps.p.outputs.feeds_branch }}
      feeds_sha: ${{ steps.p.outputs.feeds_sha }}
      node_key: ${{ steps.p.outputs.node_key }}
    steps:
      - name: Resolve SDK tarball and shard plan
        id: p
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TARGET: ${{ inputs.target }}
          IN_ARCH: ${{ inputs.arch }}
          IN_SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          V="${IN_VERSION:-24.10.8}"
          T="${IN_TARGET:-mediatek/filogic}"
          A="${IN_ARCH:-aarch64_cortex-a53}"
          N="${IN_SHARDS:-2}"
          export N

          base="https://downloads.openwrt.org/releases/${V}/targets/${T}"
          sums="$(curl -fsSL "$base/sha256sums")"
          f="$(printf '%s\n' "$sums" | grep -oP 'openwrt-sdk-[^ ]+Linux-x86_64\.tar\.(xz|zst)' | head -1)"
          [ -n "$f" ] || { echo "::error::не найден SDK в $base/sha256sums"; exit 1; }
          sha="$(printf '%s\n' "$sums" | grep -F "$f" | awk '{print $1}')"
          slug="$(printf '%s-%s' "$V" "$T" | tr '/, ' '---')"

          # Ветка node-фида под релиз: 24.10.8 -> openwrt-24.10 (у nxhack своя ветка на каждый релиз).
          # master тянет самый новый Node (26.x) и пакеты, которым нужен более свежий OpenWRT.
          fb="openwrt-${V%.*}"
          ref="$(git ls-remote --heads "${NODE_FEED_URL}" "refs/heads/${fb}" 2>/dev/null | cut -f1)"
          if [ -z "$ref" ]; then
            echo "::warning::ветки $fb в node-фиде нет — беру master"
            fb="master"
            ref="$(git ls-remote --heads "${NODE_FEED_URL}" refs/heads/master 2>/dev/null | cut -f1)"
          fi
          feeds_sha="${ref:-unknown}"
          echo "ветка node-фида: $fb (${feeds_sha:0:12})"

          # Ключ кэша собранного Node. Меняется при смене SDK, таргета или коммита фида,
          # поэтому при обновлении апстрима Node пересоберётся один раз и снова закэшируется.
          node_key="node-state-v2-${slug}-${feeds_sha:0:16}"

          shards_json="$(python3 -c "import json,os;print(json.dumps(list(range(1,int(os.environ['N'])+1))))")"

          {
            echo "version=$V"
            echo "target=$T"
            echo "arch=$A"
            echo "sdk_url=$base/$f"
            echo "sdk_file=$f"
            echo "sdk_sha=$sha"
            echo "cache_slug=$slug"
            echo "shard_count=$N"
            echo "shards=$shards_json"
            echo "feeds_branch=$fb"
            echo "feeds_sha=$feeds_sha"
            echo "node_key=$node_key"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### План сборки"
            echo ""
            echo "| параметр | значение |"
            echo "|---|---|"
            echo "| OpenWRT | \`$V\` |"
            echo "| Target | \`$T\` |"
            echo "| Arch | \`$A\` |"
            echo "| SDK | \`$f\` |"
            echo "| Ветка node-фида | \`$fb\` @ \`${feeds_sha:0:12}\` |"
            echo "| Ключ кэша Node | \`$node_key\` |"
            echo "| Шардов для пакетов | \`$N\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- build-node
  # Самый дорогой кусок: рантайм Node.js + npm + yarn (npm/yarn пакуются из дерева node).
  build-node:
    name: build node runtime
    needs: plan
    if: ${{ inputs.artifacts_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SDK_DIR: ${{ github.workspace }}/sdk
      ARCH: ${{ needs.plan.outputs.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache curl file gawk g++-multilib gcc-multilib \
            genisoimage git-core libatomic1 libdw-dev libelf-dev libncurses-dev \
            locales python3 python3-setuptools python3-pyelftools rsync \
            subversion swig unzip wget zstd

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.sdk-tarball
          # tarball не меняется после скачивания → кэш детерминированный, SDK всегда распаковывается свежим
          key: sdk-tarball-${{ needs.plan.outputs.cache_slug }}-${{ needs.plan.outputs.sdk_sha }}

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SDK_DIR }}/dl
          # ключ статический: источники не перезаписываются, -v1 бампать при желании обновить
          key: dl-${{ needs.plan.outputs.cache_slug }}-v1

      - name: Restore cached node build state
        id: node-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/node-state.tar.zst
          # Точный ключ = SDK + таргет + коммит node-фида.
          # restore-keys даёт мягкий фолбэк: если апстрим сдвинулся, берём предыдущее
          # состояние, и make пересобирает Node только если реально изменились его
          # источник/Makefile (штампы .prepared завязаны на md5 каталога пакета).
          key: ${{ needs.plan.outputs.node_key }}
          restore-keys: |
            node-state-v2-${{ needs.plan.outputs.cache_slug }}-

      - name: Fetch and extract SDK
        env:
          SDK_URL: ${{ needs.plan.outputs.sdk_url }}
          SDK_SHA: ${{ needs.plan.outputs.sdk_sha }}
          SDK_FILE: ${{ needs.plan.outputs.sdk_file }}
        run: |
          set -euo pipefail
          mkdir -p .sdk-tarball "$SDK_DIR"
          tb=".sdk-tarball/${SDK_FILE}"
          if [ ! -f "$tb" ] || [ "$(sha256sum "$tb" | cut -d' ' -f1)" != "${SDK_SHA}" ]; then
            rm -f "$tb"
            wget -nv -O "$tb" "${SDK_URL}"
          fi
          echo "${SDK_SHA}  $tb" | sha256sum -c -
          tar xf "$tb" -C "$SDK_DIR" --strip=1 --no-same-owner
          du -sh "$SDK_DIR"

      - name: Prepare feeds and config
        working-directory: ${{ env.SDK_DIR }}
        env:
          FEEDS_BRANCH: ${{ needs.plan.outputs.feeds_branch }}
        run: |
          set -euo pipefail
          cp feeds.conf.default feeds.conf
          echo "src-git node ${NODE_FEED_URL};${FEEDS_BRANCH}" >> feeds.conf
          # 'base' в SDK — detached HEAD, его update штатно ругается; node-фид проверяем ниже
          ./scripts/feeds update -a || echo "::warning::feeds update сообщил об ошибках (ожидаемо для 'base')"
          [ -d feeds/node ] || { echo "::error::node-фид не скачался"; exit 1; }
          ./scripts/feeds install -a
          # убираем node v20 из packages-фида, чтобы победил node из nxhack
          rm -rf package/feeds/packages/node*
          ./scripts/feeds install -f -a -p node
          make defconfig
          {
            echo 'CONFIG_NODEJS_22=y'
            echo 'CONFIG_NODEJS_HOST_BIN=y'
            echo 'CONFIG_CCACHE=y'
          } >> .config
          make defconfig
          grep -q '^CONFIG_NODEJS_22=y' .config \
            || echo "::warning::CONFIG_NODEJS_22 не применился, в конфиге: $(grep -o '^CONFIG_NODEJS_[0-9]*' .config | sort -u | tr '\n' ' ')"
          df -h /

      - name: Unpack cached node build state
        id: node-state
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/node-state.tar.zst"
          if [ -f "$tgz" ]; then
            tar --zstd -xf "$tgz" -C "$SDK_DIR" --no-same-owner
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "состояние Node восстановлено из кэша — сборка V8 не нужна"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "кэша нет — Node будет собран с нуля"
          fi

      - name: Build node runtime
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -uo pipefail
          : > failures.txt
          targets=()
          for p in node node-npm node-yarn; do
            # пакеты фида установлены симлинками — проверяем через -e
            [ -e "package/feeds/node/$p" ] && targets+=("package/feeds/node/$p/compile")
          done
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::в node-фиде нет ни node, ни node-npm, ни node-yarn"
            exit 1
          fi
          echo "цели: ${targets[*]}"
          rc=0
          # РОВНО ОДИН вызов make: повторные вызовы в той же песочнице заставляют OpenWrt
          # перегенерировать .config и запускать clean-build → полная пересборка node/openssl.
          # CONFIG_AUTOREMOVE обязателен: с ним штамп .prepared считается по содержимому
          # (find_md5_reproducible), а без него — с mtime файлов (find_md5), и тогда
          # перенесённое состояние в шардах не совпадает и Node собирается заново.
          make "${targets[@]}" -j"$(nproc)" -k V=0 CONFIG_AUTOREMOVE=y 2>&1 | tee build-node.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::сборка рантайма сообщила об ошибках (rc=$rc) — смотрим ipk ниже"
            echo "node-runtime" >> failures.txt
          fi
          ls -la bin/packages/"$ARCH"/node/*.ipk 2>/dev/null || echo "ipk пока нет"

      - name: Collect ipk
        env:
          ARCH_OUT: ${{ needs.plan.outputs.arch }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/dist/packages/${ARCH_OUT}/node"
          mkdir -p "$out"
          shopt -s nullglob
          files=("$SDK_DIR"/bin/packages/"${ARCH_OUT}"/node/*.ipk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::джоба не собрала ни одного ipk"
            exit 1
          fi
          cp -v "${files[@]}" "$out/"

      - name: Upload ipk
        uses: actions/upload-artifact@v7
        with:
          name: ipk-node
          path: dist/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Pack node build state
        if: steps.node-state.outputs.hit != 'true'
        working-directory: ${{ env.SDK_DIR }}
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Шардам нужны не только файлы, но и штампы сборки (.prepared/.built/.installed),
          # иначе make пересоберёт node с нуля. Штампы host-сборки лежат в build_dir/host
          # (host-build.mk), target — в build_dir/target-*, файлы — в staging_dir.
          # bin/packages нужен на случай восстановления из кэша: make готовый Node не
          # перепаковывает, поэтому ipk тоже кладём в состояние.
          files=(staging_dir bin/packages)
          for d in build_dir/host/node-* build_dir/target-*/node-*; do files+=("$d"); done
          echo "в состояние входит:"; printf '  %s\n' "${files[@]}"
          tar -I 'zstd -3 -T0' -cf "$RUNNER_TEMP/node-state.tar.zst" "${files[@]}"
          ls -lh "$RUNNER_TEMP/node-state.tar.zst"

      - name: Upload node build state
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: node-state
          path: ${{ runner.temp }}/node-state.tar.zst
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-node
          path: |
            ${{ env.SDK_DIR }}/build-node.log
            ${{ env.SDK_DIR }}/logs/
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------- build-modules
  # «Остальные» пакеты фида, разложенные по шардам (round-robin по именам каталогов).
  # Ждут build-node и берут его готовое состояние: собирать Node в каждом шарде
  # бессмысленно — у 140 из 150 пакетов фида PKG_BUILD_DEPENDS:=node/host.
  build-modules:
    name: shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan, build-node]
    if: ${{ inputs.artifacts_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SDK_DIR: ${{ github.workspace }}/sdk
      ARCH: ${{ needs.plan.outputs.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache curl file gawk g++-multilib gcc-multilib \
            genisoimage git-core libatomic1 libdw-dev libelf-dev libncurses-dev \
            locales python3 python3-setuptools python3-pyelftools rsync \
            subversion swig unzip wget zstd

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.sdk-tarball
          key: sdk-tarball-${{ needs.plan.outputs.cache_slug }}-${{ needs.plan.outputs.sdk_sha }}

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SDK_DIR }}/dl
          key: dl-${{ needs.plan.outputs.cache_slug }}-v1

      - name: Fetch and extract SDK
        env:
          SDK_URL: ${{ needs.plan.outputs.sdk_url }}
          SDK_SHA: ${{ needs.plan.outputs.sdk_sha }}
          SDK_FILE: ${{ needs.plan.outputs.sdk_file }}
        run: |
          set -euo pipefail
          mkdir -p .sdk-tarball "$SDK_DIR"
          tb=".sdk-tarball/${SDK_FILE}"
          if [ ! -f "$tb" ] || [ "$(sha256sum "$tb" | cut -d' ' -f1)" != "${SDK_SHA}" ]; then
            rm -f "$tb"
            wget -nv -O "$tb" "${SDK_URL}"
          fi
          echo "${SDK_SHA}  $tb" | sha256sum -c -
          tar xf "$tb" -C "$SDK_DIR" --strip=1 --no-same-owner
          du -sh "$SDK_DIR"

      - name: Prepare feeds and config
        working-directory: ${{ env.SDK_DIR }}
        env:
          FEEDS_BRANCH: ${{ needs.plan.outputs.feeds_branch }}
        run: |
          set -euo pipefail
          cp feeds.conf.default feeds.conf
          echo "src-git node ${NODE_FEED_URL};${FEEDS_BRANCH}" >> feeds.conf
          ./scripts/feeds update -a || echo "::warning::feeds update сообщил об ошибках (ожидаемо для 'base')"
          [ -d feeds/node ] || { echo "::error::node-фид не скачался"; exit 1; }
          ./scripts/feeds install -a
          rm -rf package/feeds/packages/node*
          ./scripts/feeds install -f -a -p node
          make defconfig
          {
            echo 'CONFIG_NODEJS_22=y'
            echo 'CONFIG_NODEJS_HOST_BIN=y'
            echo 'CONFIG_CCACHE=y'
          } >> .config
          make defconfig
          df -h /

      - name: Download node build state
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: node-state
          path: ${{ runner.temp }}/node-state

      - name: Unpack node build state
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/node-state/node-state.tar.zst"
          if [ ! -f "$tgz" ]; then
            echo "::warning::состояние Node недоступно — шард соберёт Node сам"
            exit 0
          fi
          tar --zstd -xf "$tgz" -C "$SDK_DIR" --no-same-owner staging_dir build_dir \
            || echo "::warning::не всё состояние распаковалось"
          ls -lh "$SDK_DIR/staging_dir/host/bin/node" 2>/dev/null \
            || echo "::warning::host-node в состоянии не найден"
          ls -d "$SDK_DIR"/build_dir/target-*/node-* 2>/dev/null || true

      - name: Build shard packages
        working-directory: ${{ env.SDK_DIR }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shard_count }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          # node/node-npm/node-yarn собирает отдельная джоба build-node.
          # Пакеты фида установлены симлинками, поэтому глоб с '/', а не find -type d.
          pkgs=()
          idx=0
          for d in package/feeds/node/*/; do
            name="$(basename "$d")"
            case "$name" in
              node|node-npm|node-yarn) continue ;;
            esac
            if (( idx % SHARDS == SHARD - 1 )); then
              pkgs+=("$name")
            fi
            idx=$((idx + 1))
          done
          if [ ${#pkgs[@]} -gt 0 ]; then
            printf '%s\n' "${pkgs[@]}" > shard-list.txt
          else
            : > shard-list.txt
          fi
          echo "шард ${SHARD}/${SHARDS}: ${#pkgs[@]} пакетов (всего каталогов: $idx)"

          : > failures.txt
          targets=()
          for p in "${pkgs[@]}"; do targets+=("package/feeds/node/$p/compile"); done
          echo "целей: ${#targets[@]}"

          if [ ${#targets[@]} -gt 0 ]; then
            rc=0
            # РОВНО ОДИН вызов make на шард. Раньше было по батчам с ретраями, и каждый
            # следующий вызов make перегенерировал .config → OpenWrt запускал clean-build
            # и заново собирал node/openssl (отсюда 2+ часа в одном шарде).
            # -k продолжает сборку после ошибок, список упавших достаём из лога.
            # CONFIG_AUTOREMOVE обязан совпадать с build-node: от него зависит имя штампа
            # .prepared, а значит и то, признает ли шард перенесённый Node собранным.
            make "${targets[@]}" -j"$(nproc)" -k V=0 CONFIG_AUTOREMOVE=y 2>&1 | tee build.log || rc=$?
            echo "make rc=$rc"
            if grep -qE '\-C feeds/node/node(-host)? ' build.log; then
              echo "::warning::шард пересобирал Node сам — состояние из build-node не подошло"
            else
              echo "Node не пересобирался: готовое состояние принято"
            fi
            grep -hoE 'ERROR: [^ ]+ failed to build|ERROR: package/[^ ]+ failed' build.log 2>/dev/null \
              | sed -E 's#^ERROR: (package/feeds/node/)?##; s# failed.*##' | sort -u > failures.txt || true
          fi

          echo "--- упало: $(wc -l < failures.txt) ---"
          cat failures.txt

      - name: Collect ipk
        env:
          ARCH_OUT: ${{ needs.plan.outputs.arch }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/dist/packages/${ARCH_OUT}/node"
          mkdir -p "$out"
          shopt -s nullglob
          files=("$SDK_DIR"/bin/packages/"${ARCH_OUT}"/node/*.ipk)
          if [ ${#files[@]} -gt 0 ]; then
            cp -v "${files[@]}" "$out/"
          fi
          echo "ipk в шарде: $(find "$out" -name '*.ipk' | wc -l)"

      - name: Upload ipk
        uses: actions/upload-artifact@v7
        with:
          name: ipk-shard-${{ matrix.shard }}
          path: dist/
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-shard-${{ matrix.shard }}
          path: |
            ${{ env.SDK_DIR }}/build.log
            ${{ env.SDK_DIR }}/failures.txt
            ${{ env.SDK_DIR }}/shard-list.txt
            ${{ env.SDK_DIR }}/logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### шард ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}"
            echo ""
            echo "собрано ipk: \`$(find dist -name '*.ipk' 2>/dev/null | wc -l)\`"
            echo ""
            if [ -s "$SDK_DIR/failures.txt" ]; then
              echo "**упавшие пакеты:**"
              echo '```'
              cat "$SDK_DIR/failures.txt"
              echo '```'
            else
              echo "упавших пакетов нет"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- deploy
  # Один общий индекс на все артефакты + подпись + публикация.
  deploy:
    name: index + publish
    needs: [plan, build-node, build-modules]
    if: ${{ !cancelled() && (needs.build-node.result == 'success' || needs.build-node.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SDK_DIR: ${{ github.workspace }}/sdk
      ARCH: ${{ needs.plan.outputs.arch }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.sdk-tarball
          key: sdk-tarball-${{ needs.plan.outputs.cache_slug }}-${{ needs.plan.outputs.sdk_sha }}

      - name: Fetch and extract SDK
        env:
          SDK_URL: ${{ needs.plan.outputs.sdk_url }}
          SDK_SHA: ${{ needs.plan.outputs.sdk_sha }}
          SDK_FILE: ${{ needs.plan.outputs.sdk_file }}
        run: |
          set -euo pipefail
          mkdir -p .sdk-tarball "$SDK_DIR"
          tb=".sdk-tarball/${SDK_FILE}"
          if [ ! -f "$tb" ] || [ "$(sha256sum "$tb" | cut -d' ' -f1)" != "${SDK_SHA}" ]; then
            rm -f "$tb"
            wget -nv -O "$tb" "${SDK_URL}"
          fi
          echo "${SDK_SHA}  $tb" | sha256sum -c -
          tar xf "$tb" -C "$SDK_DIR" --strip=1 --no-same-owner

      - name: Download ipk artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: ipk-*
          # artifacts_run позволяет переиспользовать ipk прошлого прогона:
          # тогда сборка не нужна и остаётся только индекс + подпись + публикация.
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate index and sign
        working-directory: ${{ env.SDK_DIR }}
        env:
          OPKG_SIGN_KEY: ${{ secrets.OPKG_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPKG_SIGN_KEY:-}" ]; then
            echo "::error::секрет OPKG_SIGN_KEY не задан — публиковать неподписанный фид нельзя"
            exit 1
          fi
          printf '%s' "$OPKG_SIGN_KEY" | base64 -d > key-build
          chmod 600 key-build
          cp -v "$GITHUB_WORKSPACE/key-build.pub" .

          usign="./staging_dir/host/bin/usign"
          if [ ! -x "$usign" ]; then
            found="$(command -v usign || true)"
            if [ -n "$found" ]; then
              usign="$found"
            else
              echo "usign в SDK нет — собираю из tools/usign"
              make tools/usign/compile -j"$(nproc)" || true
              usign="./staging_dir/host/bin/usign"
            fi
          fi
          [ -x "$usign" ] || { echo "::error::usign не найден"; exit 1; }
          # Проверяем секрет по существу: подписываем пробное сообщение и проверяем подпись
          # опубликованным key-build.pub. usign -F -p на приватном ключе не работает.
          grep -q 'untrusted comment' key-build \
            || { echo "::error::OPKG_SIGN_KEY после base64 -d не похож на usign-ключ"; exit 1; }
          msg="$(mktemp)"; sig="$(mktemp)"
          printf 'key-check' > "$msg"
          "$usign" -S -m "$msg" -s key-build -x "$sig" \
            || { echo "::error::usign не смог подписать пробное сообщение ключом из OPKG_SIGN_KEY"; exit 1; }
          if ! "$usign" -V -m "$msg" -x "$sig" -p key-build.pub 2>/dev/null; then
            echo "::error::OPKG_SIGN_KEY не соответствует key-build.pub — фид нельзя публиковать"
            exit 1
          fi
          rm -f "$msg" "$sig"
          pub="$("$usign" -F -p key-build.pub)"
          echo "ключ подписи ok: $pub"

          mkdir -p bin/packages
          cp -a "$GITHUB_WORKSPACE/dist/packages/." bin/packages/
          cp -v key-build.pub "bin/packages/$ARCH/"

          idx="bin/packages/$ARCH/node/Packages"

          # ipkg-make-index.sh зовёт "$MKHASH sha256 <файл>", а в голом SDK (без фидов)
          # MKHASH не задан — отсюда был "sha256: command not found" (exit 127).
          mkhash="staging_dir/host/bin/mkhash"
          if [ -x "$mkhash" ]; then
            export MKHASH="$PWD/$mkhash"
            echo "MKHASH: $MKHASH"
          else
            shim="$RUNNER_TEMP/bin"
            mkdir -p "$shim"
            printf '%s\n' '#!/bin/sh' 'shift' 'sha256sum "$@" | cut -d" " -f1' > "$shim/mkhash"
            chmod +x "$shim/mkhash"
            export MKHASH="$shim/mkhash"
            echo "MKHASH: обёртка над sha256sum"
          fi

          # Индекс генерируем сами, без make package/index: в SDK без фидов он кладёт
          # индекс не туда, где его ждёт opkg (src/gz .../<arch>/node). Скрипт запускаем
          # внутри каталога фида, иначе в Filename попадёт полный путь и opkg его не найдёт.
          for d in bin/packages/*/*/; do
            [ -d "$d" ] || continue
            ( cd "$d" && "$SDK_DIR/scripts/ipkg-make-index.sh" . > Packages )
            gzip -9nc "$d/Packages" > "$d/Packages.gz"
            "$usign" -S -m "$d/Packages" -s key-build -x "$d/Packages.sig"
            echo "индекс: $d — $(grep -c '^Package:' "$d/Packages") пакетов"
          done

          [ -f "$idx" ] || { echo "::error::Packages не сгенерирован"; exit 1; }
          [ -f "$idx.sig" ] || { echo "::error::Packages.sig нет — подпись не удалась"; exit 1; }

          # Сверяем id ключа из подписи с опубликованным key-build.pub: именно так клиент
          # выбирает ключ. usign -V оставляем диагностикой — он пишет в stderr и на разных
          # сборках ведёт себя по-разному, блокировать публикацию из-за него нельзя.
          sigkey="$(sed -n 's/^untrusted comment: signed by key //p' "$idx.sig" | tr -d '\r' | head -1)"
          echo "Packages.sig подписан ключом: ${sigkey:-?} (опубликован: $pub)"
          if [ "$sigkey" != "$pub" ]; then
            echo "::error::подпись индекса сделана ключом ${sigkey:-?}, а опубликован $pub — фид сломается у клиентов"
            exit 1
          fi
          if ! vout="$("$usign" -V -m "$idx" -x "$idx.sig" -p key-build.pub 2>&1)"; then
            echo "::warning::usign -V не подтвердил подпись: ${vout:-без вывода}"
          else
            echo "usign -V: ${vout:-ok}"
          fi

          ipks="$(find bin/packages -name '*.ipk' | wc -l)"
          inidx="$(grep -c '^Package:' "$idx")"
          echo "ipk: $ipks, записей в индексе: $inidx"
          [ "$ipks" -ge "${MIN_PACKAGES}" ] || { echo "::error::слишком мало пакетов ($ipks < $MIN_PACKAGES) — публикация отменена"; exit 1; }
          [ "$inidx" -ge "${MIN_PACKAGES}" ] || { echo "::error::индекс неполный ($inidx < $MIN_PACKAGES)"; exit 1; }

          {
            echo "### Публикация"
            echo ""
            echo "- пакетов: \`$inidx\`"
            echo "- объём: \`$(du -sh bin/packages | cut -f1)\`"
            echo "- ключ: \`$pub\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SDK_DIR }}/bin/packages
          destination_dir: packages
          # история ветки не должна расти на гигабайты каждый прогон
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "packages: ${{ needs.plan.outputs.version }} ${{ needs.plan.outputs.arch }}"

      - name: Smoke test published feed
        run: |
          set -euo pipefail
          url="https://$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d/ -f1).github.io/$(echo '${{ github.repository }}' | cut -d/ -f2)/packages/${{ env.ARCH }}/node"
          echo "проверяю $url"
          for attempt in $(seq 1 20); do
            if body="$(curl -fsSL "$url/Packages" 2>/dev/null)"; then
              n="$(printf '%s\n' "$body" | grep -c '^Package:')"
              echo "попытка $attempt: опубликовано пакетов: $n"
              [ "$n" -ge "${MIN_PACKAGES}" ]
              exit 0
            fi
            echo "попытка $attempt: индекса ещё нет, ждём 15с"
            sleep 15
          done
          echo "::error::опубликованный индекс не читается: $url/Packages"
          exit 1
