# ОДНОРАЗОВЫЙ ФАЙЛ — удаляет себя после запуска.
name: Dispatch once

on:
  push:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[dispatch-once]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cancel in-progress build runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
                   --status in_progress --json databaseId --jq '.[].databaseId' || true)"
          echo "in-progress: ${ids:-none}"
          for id in $ids; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" && echo "cancel requested: $id" || true
          done

      - name: Purge stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          show() {
            gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json key,sizeInBytes --jq '.[] | "\(.sizeInBytes/1048576|floor) MB\t\(.key)"' || true
          }
          echo "=== до очистки ==="; show
          # мусор от прежнего workflow: кэш всего SDK и dl с ключом по run_id
          for key in \
            "openwrt-sdk-24.10.6-mediatek-filogic-1" \
            "dl-cache-41196334895" \
            "node-state-24.10.8-mediatek-filogic-2d4fbc2f0d618404"
          do
            if gh cache delete "$key" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              echo "удалён: $key"
            else
              echo "пропущен (нет такого): $key"
            fi
          done
          echo "=== после очистки ==="; show

      - name: Remove this helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/dispatch-once.yml
          git commit -q -m 'ci: убрать одноразовый диспетчер сборки'
          git push -q origin main
