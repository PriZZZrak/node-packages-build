# ОДНОРАЗОВЫЙ ФАЙЛ — удаляет себя после запуска.
# Собирает лог упавшего шага прогона и кладёт его в ветку ci-log,
# потому что без авторизации логи Actions недоступны.
name: Dispatch once

on:
  push:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    if: contains(github.event.head_commit.message, '[dispatch-once]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Collect failed step log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view 43574290644 --repo "$GITHUB_REPOSITORY" --log-failed > ci-failed.log 2>&1 || true
          echo "строк в логе: $(wc -l < ci-failed.log)"
          tail -n 40 ci-failed.log || true

      - name: Publish log to branch ci-log
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B ci-log
          git add -f ci-failed.log
          git commit -q -m 'ci: лог упавшего шага прогона 116'
          git push -q -f origin ci-log

      - name: Remove this helper
        run: |
          set -euo pipefail
          git checkout -q main
          git rm -q .github/workflows/dispatch-once.yml
          git commit -q -m 'ci: убрать одноразовый диспетчер сборки'
          git push -q origin main
