# ОДНОРАЗОВЫЙ ФАЙЛ — удаляет себя после запуска.
# Складывает полный лог прогона в ветку ci-log: без авторизации логи недоступны.
name: Dispatch once

on:
  push:

permissions:
  actions: read
  contents: write

jobs:
  collect:
    if: contains(github.event.head_commit.message, '[dispatch-once]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dump full run log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view 43575367406 --repo "$GITHUB_REPOSITORY" --log > ci-full.log 2>&1 || true
          echo "строк: $(wc -l < ci-full.log)"
          grep -n '::error::\|Process completed with exit code' ci-full.log | tail -20 || true

      - name: Publish log to branch ci-log
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B ci-log
          git add -f ci-full.log
          git commit -q -m 'ci: полный лог прогона 117'
          git push -q -f origin ci-log

      - name: Remove this helper
        run: |
          set -euo pipefail
          git checkout -q main
          git rm -q .github/workflows/dispatch-once.yml
          git commit -q -m 'ci: убрать одноразовый диспетчер сборки'
          git push -q origin main
